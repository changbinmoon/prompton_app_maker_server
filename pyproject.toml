[project]
name = "prompton-ai-worker"
version = "0.1.0"
description = "Prompton AI Worker - SQS 기반 Android 앱 코드 생성 및 APK 빌드 워커"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.35.99",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "moto[sqs,s3,dynamodb]==5.0.28",
    "ruff==0.9.4",
    "mypy==1.14.1",
    "boto3-stubs[sqs,s3,dynamodb]==1.35.99",
]

# uv: 애플리케이션(비패키지) 프로젝트로 관리 - 빌드/배포 대상이 아니며
# systemd에서 `python -m main` 으로 직접 실행된다.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
